# Gradle Version Catalog

[versions]
junit-jupiter-engine = "6.0.1"
jadx = "1.5.6"
gson = "2.10.1"
logback = "1.5.17"
shadow = "8.3.3"
mcp = "0.14.0"
ktor = "3.1.2"

[libraries]
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter-engine" }
jadx-core = { module = "io.github.skylot:jadx-core", version.ref = "jadx" }
jadx-dex-input = { module = "io.github.skylot:jadx-dex-input", version.ref = "jadx" }
jadx-java-input = { module = "io.github.skylot:jadx-java-input", version.ref = "jadx" }
jadx-smali-input = { module = "io.github.skylot:jadx-smali-input", version.ref = "jadx" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
mcp-kotlin-sdk = { module = "io.modelcontextprotocol:kotlin-sdk", version.ref = "mcp" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.3.21" }
shadow = { id = "com.github.johnrengelman.shadow", version.ref = "shadow" }
