name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit & Integration Tests
        run: ./gradlew test --info

      - name: Build Shadow Fat-JAR
        run: ./gradlew :app:shadowJar

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jadx-core-mcp-jar
          path: app/build/libs/app-all.jar

  release:
    name: Create GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Shadow Fat-JAR
        run: ./gradlew :app:shadowJar

      - name: Prepare Release Asset
        run: |
          mkdir -p release-assets
          cp app/build/libs/app-all.jar release-assets/jadx-core-mcp-${{ github.ref_name }}.jar

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/jadx-core-mcp-${{ github.ref_name }}.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
